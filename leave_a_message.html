<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>留言页面</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }
    h2 {
      color: #333;
      text-align: center;
    }
    form {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-bottom: 8px;
    }
    input, textarea {
      width: 100%;
      margin-bottom: 15px;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #4caf50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <h2>留下你的留言 🙂</h2>
  <form id="messageForm">
    <label for="name">姓名：</label>
    <input type="text" id="name" name="name" placeholder="你的名字" required />

    <label for="message">留言内容：</label>
    <textarea id="message" name="message" rows="5" placeholder="写下你的留言..." required></textarea>

    <button type="submit">提交留言</button>
  </form>

  <h3 style="margin-top: 40px;">用户留言：</h3>
  <div id="messages"></div>

  <script>
    const form = document.getElementById('messageForm');
    const messagesDiv = document.getElementById('messages');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const message = document.getElementById('message').value;

      const entry = `<div><strong>${name}:</strong> ${message}</div>`;
      messagesDiv.innerHTML += entry;

      // 清空输入框
      form.reset();

      // 保存留言到 local storage（这是“保存”的方式，但 GitHub 不保存）
      localStorage.setItem('messages', JSON.stringify([...JSON.parse(localStorage.getItem('messages') || '[]'), { name, message }]));
    });

    // 页面加载时读取留言
    window.onload = function () {
      const messages = JSON.parse(localStorage.getItem('messages') || '[]');
      messages.forEach(msg => {
        const entry = `<div><strong>${msg.name}:</strong> ${msg.message}</div>`;
        messagesDiv.innerHTML += entry;
      });
    };
  </script>
</body>
</html>
